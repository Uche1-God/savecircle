{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
  <div class="sc-auth">
    <div class="sc-auth__card sc-card">
      <h1>Check your email</h1>
      <p class="text-muted">
        If an account exists with that email address, we've sent a link to
        reset your password. It may take a few minutes to arrive.
      </p>
      <p class="sc-auth__foot">
        <a href="{% url 'login' %}">Back to log in</a>
      </p>
    </div>
  </div>
{% endblock %}
