{% extends "base.html" %}

{% block title %}Access denied{% endblock %}

{% block content %}
  <div class="sc-error">
    <div class="sc-error__code">403</div>
    <h1>You don't have access to this page</h1>
    <p class="text-muted">This area is restricted to a different account role.</p>
    {% if user.is_authenticated %}
      <a class="btn btn-primary" href="{% url 'accounts:dashboard' %}">Back to your dashboard</a>
    {% else %}
      <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
    {% endif %}
  </div>
{% endblock %}
